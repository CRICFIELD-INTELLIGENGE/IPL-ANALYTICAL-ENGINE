kind = "data-app"
previewPath = "/"
title = "IPL Analytics Engine"
version = "1.0.0"
id = "artifacts/ipl-analytics"
router = "path"

[[integratedSkills]]
name = "data-visualization"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25537

[services.development]
run = "pnpm --filter @workspace/ipl-analytics run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ipl-analytics", "run", "build" ]
publicDir = "artifacts/ipl-analytics/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25537"
BASE_PATH = "/"
