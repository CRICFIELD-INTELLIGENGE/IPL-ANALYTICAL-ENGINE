<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726"/>
      <stop offset="50%" stop-color="#070C16"/>
      <stop offset="100%" stop-color="#03060B"/>
    </linearGradient>

    <!-- Border Accent Gradient -->
    <linearGradient id="cf-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#A3E635" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Stadium Illumination / Radial Aura -->
    <radialGradient id="cf-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#A3E635" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#070C16" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D Cricket Ball Leather Spherical Gradient -->
    <radialGradient id="cf-ball-grad" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FF5A5A"/>
      <stop offset="25%" stop-color="#EF4444"/>
      <stop offset="55%" stop-color="#DC2626"/>
      <stop offset="80%" stop-color="#991B1B"/>
      <stop offset="100%" stop-color="#4C0519"/>
    </radialGradient>

    <!-- Speed Swoosh Gradient -->
    <linearGradient id="cf-swoosh" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#A3E635"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>

    <!-- Ball Drop Shadow -->
    <filter id="cf-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- 1. App Icon Squircle Container -->
  <rect x="4" y="4" width="172" height="172" rx="42" fill="url(#cf-bg)" stroke="url(#cf-border)" stroke-width="3"/>
  <rect x="4" y="4" width="172" height="172" rx="42" fill="url(#cf-glow)"/>

  <!-- 2. Back segment of Speed Orbit (behind ball) -->
  <path d="M 36 104 C 30 64, 62 38, 108 40 C 138 41, 154 55, 152 70" 
        stroke="url(#cf-swoosh)" stroke-width="6.5" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- 3. Cricket Ball Body -->
  <g filter="url(#cf-shadow)">
    <!-- Ball Base Sphere -->
    <circle cx="90" cy="90" r="50" fill="url(#cf-ball-grad)"/>

    <!-- Specular Gloss Highlight -->
    <path d="M 52 74 A 44 44 0 0 1 106 48 A 40 40 0 0 0 52 74 Z" fill="#FFFFFF" opacity="0.28"/>

    <!-- Seam Path (equatorial curve) -->
    <path d="M 51 60 Q 90 92 129 120" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.95"/>
    <path d="M 51 60 Q 90 92 129 120" stroke="#FFE4E6" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Cricket Seam Cross-Stitches -->
    <g stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.92">
      <line x1="56" y1="58" x2="62" y2="70" />
      <line x1="65" y1="65" x2="71" y2="77" />
      <line x1="74" y1="72" x2="80" y2="84" />
      <line x1="83" y1="79" x2="89" y2="91" />
      <line x1="92" y1="87" x2="98" y2="99" />
      <line x1="101" y1="94" x2="107" y2="106" />
      <line x1="110" y1="101" x2="116" y2="113" />
      <line x1="119" y1="108" x2="125" y2="120" />
    </g>
  </g>

  <!-- 4. Front segment of Dynamic Speed Swoosh (sweeping over front-bottom of ball) -->
  <path d="M 152 70 C 150 88, 136 114, 108 128 C 76 144, 42 136, 26 114" 
        stroke="url(#cf-swoosh)" stroke-width="7" stroke-linecap="round" fill="none"/>
  
  <!-- Fast Spark / Kinetic Particle -->
  <circle cx="26" cy="114" r="3.5" fill="#A3E635"/>
  <circle cx="152" cy="70" r="2.5" fill="#38BDF8"/>
</svg>
